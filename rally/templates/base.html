<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Photo Rally{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('favicon') }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='icons/favicon-16x16.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('play.manifest') }}">
  <meta name="theme-color" content="#ffffff">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="bar">
    <a class="brand" href="{{ url_for('index') }}">Photo Rally</a>
    {% if g.user %}
      <a href="{{ url_for('admin.rallies') }}">Rallies</a>
      <form method="post" action="{{ url_for('auth.logout') }}"><button class="link">Log out</button></form>
    {% elif g.team %}
      <a href="{{ url_for('play.home') }}">Objects</a>
      <a href="{{ url_for('play.instructions') }}">Route</a>
      <span class="muted">{{ g.team['name'] }}</span>
    {% endif %}
  </header>
  <main>
    {% for message in get_flashed_messages() %}<div class="flash" role="status">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
